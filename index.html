<!-- ============================= Firebase (ES Module) ============================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot,
    getDocs, writeBatch, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  function isConfigured(cfg){
    return cfg && cfg.apiKey && cfg.apiKey !== "REPLACE_ME" && cfg.projectId && cfg.projectId !== "REPLACE_ME";
  }

  const cfg = window.FIREBASE_CONFIG || {};
  window.__fb = { ready:false, enabled:false };

  if (isConfigured(cfg)) {
    try {
      const app = initializeApp(cfg);
      const db = getFirestore(app);
      window.__fb = {
        ready:true, enabled:true, db, collection, doc, setDoc, deleteDoc,
        onSnapshot, getDocs, writeBatch, serverTimestamp
      };
    } catch(e){
      console.warn("Firebase init failed, falling back to local storage.", e);
      window.__fb = { ready:true, enabled:false };
    }
  } else {
    window.__fb = { ready:true, enabled:false };
  }
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<!-- ============================= Vue Application ============================= -->
<script>
window.addEventListener('firebase-ready', initApp, { once:false });
// Fallback in case the event already fired before this listener attached
if (window.__fb && window.__fb.ready) { initApp(); }

let appStarted = false;
function initApp(){
  if (appStarted) return;
  appStarted = true;

  const { createApp, reactive, computed, onMounted, ref, watch, nextTick } = Vue;

  const CATEGORIES = {
    market:     { label: 'שווקים',      color: '#c5a028', icon: 'fa-store' },
    restaurant: { label: 'מסעדות',      color: '#8b263e', icon: 'fa-utensils' },
    attraction: { label: 'אטרקציות',    color: '#4a4a45', icon: 'fa-landmark' },
    nightlife:  { label: 'בילוי',       color: '#721c30', icon: 'fa-champagne-glasses' },
    shopping:   { label: 'קניות',       color: '#d4af37', icon: 'fa-bag-shopping' },
    transport:  { label: 'תחבורה',      color: '#6b6b63', icon: 'fa-plane' },
    general:    { label: 'כללי',        color: '#9c8b6d', icon: 'fa-circle-info' },
  };

  const DAY_DATES = {
    1: '2026-09-09', 2: '2026-09-10', 3: '2026-09-11',
    4: '2026-09-12', 5: '2026-09-13', 6: '2026-09-14'
  };
  const DAY_LABELS = {
    1: 'יום 1 · שלישי', 2: 'יום 2 · רביעי', 3: 'יום 3 · חמישי',
    4: 'יום 4 · שישי', 5: 'יום 5 · שבת', 6: 'יום 6 · ראשון'
  };

  function ev(day, start, end, category, title, notes, location){
    return {
      id: 'd' + day + '_' + start.replace(':','') ,
      day, startTime:start, endTime:end, category, title,
      notes: notes || '', location: location || title,
      done:false, order:0
    };
  }

  function defaultEvents(){
    // תבנית ריקה — אין אירועים מוגדרים מראש. כל בני המשפחה מוסיפים
    // בעצמם את האירועים הרצויים דרך כפתור "אירוע חדש" בכל יום.
    return [];
  }

  function defaultHotels(){
    // תבנית ריקה — אין מלון מוגדר מראש. הוסיפו מלון/דירה דרך כפתור
    // "הוסף מלון" בתצוגת "מלונות ולינה".
    return [];
  }

  function defaultExpenses(){
    // תבנית ריקה — אין הוצאות מוגדרות מראש. הוסיפו קבלות דרך כפתור
    // "הוסף קבלה" בתצוגת "הוצאות".
    return [];
  }

  const CURRENCY_SYMBOLS = { CZK:'Kč', EUR:'€', ILS:'₪', USD:'$' };
  function formatMoney(amount, currency){
    const n = Number(amount) || 0;
    const sym = CURRENCY_SYMBOLS[currency] || currency || '';
    return n.toLocaleString('he-IL', { maximumFractionDigits: 2 }) + ' ' + sym;
  }

  // ---- Receipt image compression (keeps Firestore docs small & sync fast) ----
  function fileToCompressedDataUrl(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          const maxW = 900;
          if (width > maxW){ height = Math.round(height * (maxW / width)); width = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          let quality = 0.6;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length > 700000 && quality > 0.25){
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---- Best-effort parsing of OCR text into an amount + currency guess ----
  function parseAmountToken(token){
    let clean = token.replace(/\s/g, '');
    const commaDecimal = /,(\d{1,2})$/.test(clean);
    const dotDecimal = /\.(\d{1,2})$/.test(clean);
    if (commaDecimal) clean = clean.replace(/\./g, '').replace(',', '.');
    else if (dotDecimal) clean = clean.replace(/,/g, '');
    else clean = clean.replace(/[.,]/g, '');
    return parseFloat(clean);
  }
  function guessAmount(text){
    const numRegex = /\d{1,3}(?:[ .,]\d{3})*(?:[.,]\d{1,2})?/g;
    const keywordRegex = /(celkem|total|suma|k\s*úhradě|amount\s*due|součet|k zaplacení)/i;
    const lines = (text || '').split(/\n/);
    for (const line of lines){
      if (keywordRegex.test(line)){
        const nums = line.match(numRegex);
        if (nums && nums.length){
          const val = parseAmountToken(nums[nums.length - 1]);
          if (!isNaN(val) && val > 0) return val;
        }
      }
    }
    const all = (text || '').match(numRegex) || [];
    const parsed = all.map(parseAmountToken).filter(n => !isNaN(n) && n > 0 && n < 200000);
    return parsed.length ? Math.max(...parsed) : null;
  }
  function guessCurrency(text){
    const t = text || '';
    if (/Kč|CZK/i.test(t)) return 'CZK';
    if (/€|EUR/i.test(t)) return 'EUR';
    if (/₪|ILS|ש"ח|שח/i.test(t)) return 'ILS';
    if (/\$|USD/i.test(t)) return 'USD';
    return null;
  }

  const STORAGE_KEY_EVENTS = 'prague_trip_events_v1';
  const STORAGE_KEY_HOTELS = 'prague_trip_hotels_v1';
  const STORAGE_KEY_EXPENSES = 'prague_trip_expenses_v1';

  const app = createApp({
    setup(){
      const state = reactive({
        events: [],
        hotels: [],
        expenses: [],
        view: 'agenda',           // 'agenda' | 'gantt' | 'hotels' | 'expenses'
        dayFilter: 'all',         // 'all' | 1..6
        ganttDay: 1,
        categoryFilters: Object.keys(CATEGORIES),
        search: '',
        syncStatus: 'offline',    // 'offline' | 'syncing' | 'online'
        cloudEnabled: false,

        showEventModal: false,
        showHotelModal: false,
        showExpenseModal: false,
        showFiltersMobile: false,
        editingEvent: null,
        editingHotel: null,
        editingExpense: null,

        expenseDayFilter: 'all',
        expenseSearch: '',
        ocrStatus: 'idle',        // 'idle' | 'reading' | 'done' | 'error'
        ocrProgress: 0,

        confirmReset: false,
      });

      const CATS = CATEGORIES;
      const dayList = [1,2,3,4,5,6];

      // ---------------- persistence ----------------
      function loadLocal(){
        try{
          const e = JSON.parse(localStorage.getItem(STORAGE_KEY_EVENTS) || 'null');
          const h = JSON.parse(localStorage.getItem(STORAGE_KEY_HOTELS) || 'null');
          const x = JSON.parse(localStorage.getItem(STORAGE_KEY_EXPENSES) || 'null');
          state.events = Array.isArray(e) && e.length ? e : defaultEvents();
          state.hotels = Array.isArray(h) && h.length ? h : defaultHotels();
          state.expenses = Array.isArray(x) ? x : defaultExpenses();
        }catch(err){
          state.events = defaultEvents();
          state.hotels = defaultHotels();
          state.expenses = defaultExpenses();
        }
      }
      function saveLocal(){
        localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(state.events));
        localStorage.setItem(STORAGE_KEY_HOTELS, JSON.stringify(state.hotels));
        localStorage.setItem(STORAGE_KEY_EXPENSES, JSON.stringify(state.expenses));
      }

      let fb = null;
      let unsubEvents = null, unsubHotels = null, unsubExpenses = null;

      async function initCloud(){
        fb = window.__fb;
        if (!fb || !fb.enabled){
          state.cloudEnabled = false;
          state.syncStatus = 'offline';
          loadLocal();
          return;
        }
        state.cloudEnabled = true;
        state.syncStatus = 'syncing';

        try{
          const evCol = fb.collection(fb.db, 'trip_events');
          const hCol = fb.collection(fb.db, 'trip_hotels');
          const xCol = fb.collection(fb.db, 'trip_expenses');

          const evSnap = await fb.getDocs(evCol);
          if (evSnap.empty){
            const batch = fb.writeBatch(fb.db);
            defaultEvents().forEach(item => batch.set(fb.doc(fb.db,'trip_events', item.id), item));
            await batch.commit();
          }
          const hSnap = await fb.getDocs(hCol);
          if (hSnap.empty){
            const batch = fb.writeBatch(fb.db);
            defaultHotels().forEach(item => batch.set(fb.doc(fb.db,'trip_hotels', item.id), item));
            await batch.commit();
          }

          unsubEvents = fb.onSnapshot(evCol, snap => {
            state.events = snap.docs.map(d => d.data());
            state.syncStatus = 'online';
          }, err => { console.warn(err); state.syncStatus = 'offline'; });

          unsubHotels = fb.onSnapshot(hCol, snap => {
            state.hotels = snap.docs.map(d => d.data());
            state.syncStatus = 'online';
          }, err => { console.warn(err); state.syncStatus = 'offline'; });

          unsubExpenses = fb.onSnapshot(xCol, snap => {
            state.expenses = snap.docs.map(d => d.data());
            state.syncStatus = 'online';
          }, err => { console.warn(err); state.syncStatus = 'offline'; });

        }catch(err){
          console.warn('Cloud sync failed, using local storage instead.', err);
          state.cloudEnabled = false;
          state.syncStatus = 'offline';
          loadLocal();
        }
      }

      async function persistEvent(item){
        if (state.cloudEnabled && fb){
          await fb.setDoc(fb.doc(fb.db,'trip_events', item.id), item);
        } else {
          const idx = state.events.findIndex(e => e.id === item.id);
          if (idx >= 0) state.events[idx] = item; else state.events.push(item);
          saveLocal();
        }
      }
      async function removeEvent(id){
        if (state.cloudEnabled && fb){
          await fb.deleteDoc(fb.doc(fb.db,'trip_events', id));
        } else {
          state.events = state.events.filter(e => e.id !== id);
          saveLocal();
        }
      }
      async function persistHotel(item){
        if (state.cloudEnabled && fb){
          await fb.setDoc(fb.doc(fb.db,'trip_hotels', item.id), item);
        } else {
          const idx = state.hotels.findIndex(h => h.id === item.id);
          if (idx >= 0) state.hotels[idx] = item; else state.hotels.push(item);
          saveLocal();
        }
      }
      async function removeHotel(id){
        if (state.cloudEnabled && fb){
          await fb.deleteDoc(fb.doc(fb.db,'trip_hotels', id));
        } else {
          state.hotels = state.hotels.filter(h => h.id !== id);
          saveLocal();
        }
      }
      async function persistExpense(item){
        if (state.cloudEnabled && fb){
          await fb.setDoc(fb.doc(fb.db,'trip_expenses', item.id), item);
        } else {
          const idx = state.expenses.findIndex(x => x.id === item.id);
          if (idx >= 0) state.expenses[idx] = item; else state.expenses.push(item);
          saveLocal();
        }
      }
      async function removeExpense(id){
        if (state.cloudEnabled && fb){
          await fb.deleteDoc(fb.doc(fb.db,'trip_expenses', id));
        } else {
          state.expenses = state.expenses.filter(x => x.id !== id);
          saveLocal();
        }
      }

      async function resetToDefault(){
        const evs = defaultEvents();
        const hs = defaultHotels();
        const xs = defaultExpenses();
        if (state.cloudEnabled && fb){
          const evCol = fb.collection(fb.db,'trip_events');
          const hCol = fb.collection(fb.db,'trip_hotels');
          const xCol = fb.collection(fb.db,'trip_expenses');
          const existingEv = await fb.getDocs(evCol);
          const existingH = await fb.getDocs(hCol);
          const existingX = await fb.getDocs(xCol);
          const batch = fb.writeBatch(fb.db);
          existingEv.docs.forEach(d => batch.delete(d.ref));
          existingH.docs.forEach(d => batch.delete(d.ref));
          existingX.docs.forEach(d => batch.delete(d.ref));
          evs.forEach(item => batch.set(fb.doc(fb.db,'trip_events', item.id), item));
          hs.forEach(item => batch.set(fb.doc(fb.db,'trip_hotels', item.id), item));
          xs.forEach(item => batch.set(fb.doc(fb.db,'trip_expenses', item.id), item));
          await batch.commit();
        } else {
          state.events = evs;
          state.hotels = hs;
          state.expenses = xs;
          saveLocal();
        }
        state.confirmReset = false;
      }

      // ---------------- computed ----------------
      const filteredEvents = computed(() => {
        const q = state.search.trim().toLowerCase();
        return state.events
          .filter(e => state.dayFilter === 'all' || e.day === Number(state.dayFilter))
          .filter(e => state.categoryFilters.includes(e.category))
          .filter(e => {
            if (!q) return true;
            return (e.title||'').toLowerCase().includes(q) ||
                   (e.notes||'').toLowerCase().includes(q) ||
                   (e.location||'').toLowerCase().includes(q);
          })
          .sort((a,b) => a.day - b.day || a.startTime.localeCompare(b.startTime));
      });

      const eventsByDay = computed(() => {
        const map = {};
        dayList.forEach(d => map[d] = []);
        filteredEvents.value.forEach(e => { if(map[e.day]) map[e.day].push(e); });
        return map;
      });

      const ganttEvents = computed(() => {
        return state.events
          .filter(e => e.day === state.ganttDay)
          .filter(e => state.categoryFilters.includes(e.category))
          .filter(e => {
            const q = state.search.trim().toLowerCase();
            if(!q) return true;
            return (e.title||'').toLowerCase().includes(q);
          })
          .sort((a,b)=> a.startTime.localeCompare(b.startTime));
      });

      function toMinutes(t){
        const [h,m] = t.split(':').map(Number);
        return h*60+m;
      }

      const GANTT_START = 6*60, GANTT_END = 24*60;

      const ganttLanes = computed(() => {
        const evs = ganttEvents.value.map(e => ({...e,
          s: Math.max(GANTT_START, toMinutes(e.startTime)),
          en: Math.min(GANTT_END, toMinutes(e.endTime) <= toMinutes(e.startTime) ? GANTT_END : toMinutes(e.endTime))
        }));
        const lanes = [];
        evs.forEach(e => {
          let placed = false;
          for (const lane of lanes){
            if (lane.every(x => e.s >= x.en || e.en <= x.s)){
              lane.push(e); placed = true; break;
            }
          }
          if (!placed) lanes.push([e]);
        });
        return lanes;
      });

      function pct(minutes){
        return ((minutes - GANTT_START) / (GANTT_END - GANTT_START)) * 100;
      }

      const hourMarks = computed(() => {
        const arr = [];
        for (let h=6; h<=24; h++) arr.push(h);
        return arr;
      });

      const completionStats = computed(() => {
        const total = state.events.length;
        const done = state.events.filter(e=>e.done).length;
        return { total, done, pct: total ? Math.round(done/total*100) : 0 };
      });

      const totalsByCurrency = computed(() => {
        const map = {};
        state.expenses.forEach(x => {
          const c = x.currency || 'CZK';
          map[c] = (map[c] || 0) + (Number(x.amount) || 0);

      const categoryTotals = computed(() => {

        const updated = { ...e, done: !e.done };
        persistEvent(updated);

        state.showHotelModal = false;
        state.editingHotel = null;

        }

        state.editingHotel = null;
      }

      function openNewExpense(day){
        state.editingExpense = {
          id: 'exp_' + Date.now(),
          day: day || (state.expenseDayFilter !== 'all' ? Number(state.expenseDayFilter) : 1),
          merchant:'', amount:null, currency:'CZK', category:'general',
          notes:'', imageThumb:'', rawText:'', createdAt: Date.now()
        };
        state.ocrStatus = 'idle';
        state.ocrProgress = 0;
        state.showExpenseModal = true;
      }
      function openEditExpense(x){
        state.editingExpense = { ...x };
        state.ocrStatus = x.rawText ? 'done' : 'idle';
        state.ocrProgress = 0;
        state.showExpenseModal = true;
      }
      function saveExpense(){
        if (!state.editingExpense.amount || Number(state.editingExpense.amount) <= 0) return;
        persistExpense(state.editingExpense);
        state.showExpenseModal = false;
        state.editingExpense = null;
      }
      function deleteEditingExpense(){
        if (state.editingExpense && state.editingExpense.id){
          removeExpense(state.editingExpense.id);
        }
        state.showExpenseModal = false;
        state.editingExpense = null;
      }

      async function runOcr(dataUrl){
        state.ocrStatus = 'reading';
        state.ocrProgress = 0;
        try{
          if (typeof Tesseract === 'undefined') throw new Error('Tesseract not loaded');
          const result = await Tesseract.recognize(dataUrl, 'ces+eng', {
            logger: m => {
              if (m.status === 'recognizing text' && typeof m.progress === 'number'){
                state.ocrProgress = Math.round(m.progress * 100);
              }
            }
          });
          const text = (result && result.data && result.data.text) || '';
          state.editingExpense.rawText = text;
          const amountGuess = guessAmount(text);
          if (amountGuess && !state.editingExpense.amount){
            state.editingExpense.amount = amountGuess;
          }
          const currencyGuess = guessCurrency(text);
          if (currencyGuess){
            state.editingExpense.currency = currencyGuess;
          }
          state.ocrStatus = 'done';
        }catch(err){
          console.warn('OCR failed, falling back to manual entry.', err);
          state.ocrStatus = 'error';
        }
      }

      <main v-if="state.view==='expenses'" class="max-w-6xl mx-auto px-4 sm:px-6 mt-6 space-y-6">
        <div class="paper-card rounded-xl p-4 sm:p-5">
          <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h2 class="font-heading text-xl font-bold" style="color:var(--wine-deep)">סך ההוצאות</h2>
            <button @click="openNewExpense()" class="btn-wine rounded-lg px-4 py-2 text-sm font-medium">
              <i class="fa-solid fa-camera ml-1"></i> הוסף קבלה
            </button>
          </div>

          <div v-if="Object.keys(totalsByCurrency).length" class="flex flex-wrap gap-3">
            <div v-for="(sum, cur) in totalsByCurrency" :key="'tot'+cur" class="rounded-lg px-4 py-2" style="background:var(--paper-dark)">
              <span class="text-xs text-stone/50 block">סה״כ</span>
              <span class="font-heading text-lg font-bold" style="color:var(--wine-deep)">{{ formatMoney(sum, cur) }}</span>
            </div>
          </div>
          <p v-else class="text-sm text-stone/50">
            עדיין לא נוספו הוצאות. צלמו קבלה ראשונה — האפליקציה תזהה את הסכום אוטומטית מהתמונה.
          </p>

          <div v-if="Object.keys(categoryTotals).length" class="mt-4 pt-4 space-y-2 border-t" style="border-color:var(--paper-dark)">
            <div v-for="(sums, cat) in categoryTotals" :key="'cat'+cat" class="flex items-center gap-2 text-sm flex-wrap">
              <span class="cat-dot" :style="{background: CATS[cat].color}"></span>
              <span class="w-24 shrink-0">{{ CATS[cat].label }}</span>
              <span class="text-stone/60">
                <span v-for="(sum,cur) in sums" :key="cat+cur" class="ml-3">{{ formatMoney(sum, cur) }}</span>
              </span>
            </div>
          </div>
        </div>

        <div class="paper-card rounded-xl p-3 sm:p-4 flex flex-wrap gap-2 items-center">
          <div class="relative flex-1 min-w-[180px]">
            <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-stone/40 text-sm"></i>
            <input type="text" v-model="state.expenseSearch" placeholder="חיפוש בית עסק / הערה…" class="w-full rounded-lg pr-9 pl-3 py-2 text-sm" />
          </div>
          <button class="day-chip rounded-full px-3 py-1 text-xs sm:text-sm" :class="{active: state.expenseDayFilter==='all'}" @click="state.expenseDayFilter='all'">כל הימים</button>
          <button v-for="d in dayList" :key="'ef'+d" class="day-chip rounded-full px-3 py-1 text-xs sm:text-sm" :class="{active: state.expenseDayFilter===d}" @click="state.expenseDayFilter=d">{{ 'יום ' + d }}</button>
        </div>

        <div class="grid sm:grid-cols-2 gap-3">
          <div v-for="x in filteredExpenses" :key="x.id" class="event-card paper-card rounded-xl p-4 flex gap-3">
            <img v-if="x.imageThumb" :src="x.imageThumb" class="w-16 h-16 object-cover rounded-lg border shrink-0 cursor-pointer" style="border-color:var(--paper-dark)" @click="openEditExpense(x)" />
            <div v-else class="w-16 h-16 rounded-lg flex items-center justify-center shrink-0 cursor-pointer" style="background:var(--paper-dark)" @click="openEditExpense(x)">
              <i class="fa-solid fa-receipt text-stone/30"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="cat-dot" :style="{background: CATS[x.category].color}"></span>
                    <span class="text-xs" :style="{color: CATS[x.category].color}">{{ CATS[x.category].label }}</span>
                    <span class="text-xs text-stone/40">{{ DAY_LABELS[x.day] }}</span>
                  </div>
                  <h3 class="font-heading text-lg font-semibold mt-1 truncate">{{ x.merchant || 'הוצאה ללא שם' }}</h3>
                  <p class="text-sm font-medium mt-0.5" style="color:var(--wine-deep)">{{ formatMoney(x.amount, x.currency) }}</p>
                  <p v-if="x.notes" class="text-sm text-stone/60 mt-1">{{ x.notes }}</p>
                </div>
                <button @click="openEditExpense(x)" class="text-stone/40 hover:text-wine-deep shrink-0">
                  <i class="fa-solid fa-pen"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        <p v-if="filteredExpenses.length===0" class="text-center text-stone/50 py-10">
          <i class="fa-regular fa-face-frown text-2xl block mb-2"></i>
          לא נמצאו הוצאות התואמות לסינון הנוכחי.
        </p>
      </main>

      <!-- EVENT MODAL -->
      <div v-if="state.showEventModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50" @click.self="state.showEventModal=false">
        <div class="paper-card rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
          <h3 class="font-heading text-xl font-bold mb-4" style="color:var(--wine-deep)">{{ state.editingEvent.title ? 'עריכת אירוע' : 'אירוע חדש' }}</h3>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-stone/60">כותרת</label>
              <input type="text" v-model="state.editingEvent.title" class="w-full rounded-lg px-3 py-2 text-sm mt-1" placeholder="שם האירוע" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-stone/60">יום</label>
                <select v-model.number="state.editingEvent.day" class="w-full rounded-lg px-3 py-2 text-sm mt-1">
                  <option v-for="d in dayList" :key="'sel'+d" :value="d">{{ 'יום ' + d }}</option>
                </select>
              </div>
              <div>
                <label class="text-xs text-stone/60">קטגוריה</label>
                <select v-model="state.editingEvent.category" class="w-full rounded-lg px-3 py-2 text-sm mt-1">
                  <option v-for="(c,key) in CATS" :key="'catopt'+key" :value="key">{{ c.label }}</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-stone/60">שעת התחלה</label>
                <input type="time" v-model="state.editingEvent.startTime" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
              <div>
                <label class="text-xs text-stone/60">שעת סיום</label>
                <input type="time" v-model="state.editingEvent.endTime" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
            </div>
            <div>
              <label class="text-xs text-stone/60">מיקום (לחיפוש בגוגל מפות)</label>
              <input type="text" v-model="state.editingEvent.location" class="w-full rounded-lg px-3 py-2 text-sm mt-1" placeholder="שם המקום או כתובת" />
            </div>
            <div>
              <label class="text-xs text-stone/60">הערות</label>
              <textarea v-model="state.editingEvent.notes" rows="3" class="w-full rounded-lg px-3 py-2 text-sm mt-1"></textarea>
            </div>
          </div>
          <div class="flex items-center justify-between mt-6">
            <button v-if="state.editingEvent.id" @click="deleteEditingEvent" class="text-sm text-red-700/70 hover:text-red-800">
              <i class="fa-solid fa-trash ml-1"></i> מחיקה
            </button>
            <div class="flex gap-2 mr-auto">
              <button @click="state.showEventModal=false" class="rounded-lg px-4 py-2 text-sm btn-gold-outline">ביטול</button>
              <button @click="saveEvent" class="rounded-lg px-4 py-2 text-sm btn-wine font-medium">שמירה</button>
            </div>
          </div>
        </div>
      </div>

      <!-- HOTEL MODAL -->
      <div v-if="state.showHotelModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50" @click.self="state.showHotelModal=false">
        <div class="paper-card rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
          <h3 class="font-heading text-xl font-bold mb-4" style="color:var(--wine-deep)">פרטי לינה</h3>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-stone/60">שם המלון / הדירה</label>
              <input type="text" v-model="state.editingHotel.name" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
            </div>
            <div>
              <label class="text-xs text-stone/60">כתובת מדויקת (תשמש לניווט בגוגל מפות)</label>
              <input type="text" v-model="state.editingHotel.address" class="w-full rounded-lg px-3 py-2 text-sm mt-1" placeholder="לדוגמה: Melantrichova 17, 110 00 Praha 1" />
            </div>
            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="text-xs text-stone/60">Check-in</label>
                <input type="date" v-model="state.editingHotel.checkIn" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
              <div>
                <label class="text-xs text-stone/60">Check-out</label>
                <input type="date" v-model="state.editingHotel.checkOut" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
              <div>
                <label class="text-xs text-stone/60">לילות</label>
                <input type="number" min="0" v-model.number="state.editingHotel.nights" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
            </div>
            <div>
              <label class="text-xs text-stone/60">הערות</label>
              <textarea v-model="state.editingHotel.notes" rows="3" class="w-full rounded-lg px-3 py-2 text-sm mt-1"></textarea>
            </div>
          </div>
          <div class="flex items-center justify-between mt-6">
            <button @click="deleteEditingHotel" class="text-sm text-red-700/70 hover:text-red-800">
              <i class="fa-solid fa-trash ml-1"></i> מחיקה
            </button>
            <div class="flex gap-2 mr-auto">
              <button @click="state.showHotelModal=false" class="rounded-lg px-4 py-2 text-sm btn-gold-outline">ביטול</button>
              <button @click="saveHotel" class="rounded-lg px-4 py-2 text-sm btn-wine font-medium">שמירה</button>
            </div>
          </div>
        </div>
      </div>

      <!-- EXPENSE MODAL -->
      <div v-if="state.showExpenseModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50" @click.self="state.showExpenseModal=false">
        <div class="paper-card rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
          <h3 class="font-heading text-xl font-bold mb-4" style="color:var(--wine-deep)">קבלה / הוצאה</h3>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-stone/60">תמונת קבלה (אופציונלי — יזוהה אוטומטית)</label>
              <input type="file" accept="image/*" capture="environment" @change="onReceiptFileChange" class="w-full text-sm mt-1" />
              <div v-if="state.editingExpense.imageThumb" class="mt-2">
                <img :src="state.editingExpense.imageThumb" class="w-full max-h-56 object-contain rounded-lg border" style="border-color:var(--paper-dark)" />
              </div>
              <p v-if="state.ocrStatus==='reading'" class="text-xs mt-1.5" style="color:var(--gold-deep)">
                <i class="fa-solid fa-spinner fa-spin ml-1"></i> מזהה טקסט מהתמונה… {{ state.ocrProgress }}% (בפעם הראשונה זה עשוי לקחת יותר זמן)
              </p>
              <p v-else-if="state.ocrStatus==='done'" class="text-xs mt-1.5 text-stone/50">
                <i class="fa-solid fa-circle-check ml-1"></i> הזיהוי הושלם — בדקו שהסכום והמטבע נכונים ותקנו במידת הצורך.
              </p>
              <p v-else-if="state.ocrStatus==='error'" class="text-xs mt-1.5 text-red-700/70">
                לא הצלחנו לזהות טקסט אוטומטית מהתמונה — מלאו את הסכום ידנית.
              </p>
              <details v-if="state.editingExpense.rawText" class="mt-2">
                <summary class="text-xs text-stone/50 cursor-pointer">הצג טקסט שזוהה מהקבלה</summary>
                <pre class="text-xs text-stone/60 whitespace-pre-wrap mt-1 max-h-32 overflow-y-auto">{{ state.editingExpense.rawText }}</pre>
              </details>
            </div>

            <div>
              <label class="text-xs text-stone/60">בית עסק / תיאור</label>
              <input type="text" v-model="state.editingExpense.merchant" class="w-full rounded-lg px-3 py-2 text-sm mt-1" placeholder="לדוגמה: מסעדת Jaffa" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-stone/60">סכום</label>
                <input type="number" step="0.01" min="0" v-model.number="state.editingExpense.amount" class="w-full rounded-lg px-3 py-2 text-sm mt-1" />
              </div>
              <div>
                <label class="text-xs text-stone/60">מטבע</label>
                <select v-model="state.editingExpense.currency" class="w-full rounded-lg px-3 py-2 text-sm mt-1">
                  <option value="CZK">CZK — קורונה צ׳כית</option>
                  <option value="EUR">EUR — יורו</option>
                  <option value="ILS">ILS — שקל</option>
                  <option value="USD">USD — דולר</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs text-stone/60">יום</label>
                <select v-model.number="state.editingExpense.day" class="w-full rounded-lg px-3 py-2 text-sm mt-1">
                  <option v-for="d in dayList" :key="'expday'+d" :value="d">{{ 'יום ' + d }}</option>
                </select>
              </div>
              <div>
                <label class="text-xs text-stone/60">קטגוריה</label>
                <select v-model="state.editingExpense.category" class="w-full rounded-lg px-3 py-2 text-sm mt-1">
                  <option v-for="(c,key) in CATS" :key="'expcat'+key" :value="key">{{ c.label }}</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-xs text-stone/60">הערות</label>
              <textarea v-model="state.editingExpense.notes" rows="2" class="w-full rounded-lg px-3 py-2 text-sm mt-1"></textarea>
            </div>
          </div>
          <div class="flex items-center justify-between mt-6">
            <button v-if="state.expenses.some(x => x.id === state.editingExpense.id)" @click="deleteEditingExpense" class="text-sm text-red-700/70 hover:text-red-800">
              <i class="fa-solid fa-trash ml-1"></i> מחיקה
            </button>
            <div class="flex gap-2 mr-auto">
              <button @click="state.showExpenseModal=false" class="rounded-lg px-4 py-2 text-sm btn-gold-outline">ביטול</button>
              <button @click="saveExpense" class="rounded-lg px-4 py-2 text-sm btn-wine font-medium">שמירה</button>
            </div>
          </div>
        </div>
      </div>

      <!-- RESET CONFIRM -->
      <div v-if="state.confirmReset" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50" @click.self="state.confirmReset=false">
        <div class="paper-card rounded-2xl w-full max-w-sm p-6 text-center">
          <i class="fa-solid fa-triangle-exclamation text-2xl mb-3" style="color:var(--wine-deep)"></i>
          <h3 class="font-heading text-lg font-bold mb-2">איפוס הלו״ז?</h3>
          <p class="text-sm text-stone/60 mb-5">כל השינויים שנעשו על ידי המשפחה יימחקו והלו״ז יחזור לנתוני ברירת המחדל המקוריים.</p>
          <div class="flex gap-2 justify-center">
            <button @click="state.confirmReset=false" class="rounded-lg px-4 py-2 text-sm btn-gold-outline">ביטול</button>
            <button @click="resetToDefault" class="rounded-lg px-4 py-2 text-sm btn-wine font-medium">כן, אפס</button>
          </div>
        </div>
      </div>

      <footer class="max-w-6xl mx-auto px-4 sm:px-6 mt-12 text-center text-xs text-stone/40">
        <div class="ornament-line mb-4"></div>
        נבנה באהבה למשפחה 🕊️ · פראג, 9–14 בספטמבר
      </footer>
    </div>
    `
  });

  app.mount('#app');
}
</script>
</body>
</html>
